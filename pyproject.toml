[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjlab-contact-prep"
version = "0.1.0"
description = "Standalone Estun 20 N contact preparation experiments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["mjlab==1.3.0", "mujoco==3.7.0", "mujoco-warp==3.7.0.1", "scipy==1.15.3", "rsl-rl-lib==5.0.1", "tensordict==0.14.0", "numpy", "torch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ZaowenChen/mjlab-peg-hole-search"
Issues = "https://github.com/ZaowenChen/mjlab-peg-hole-search/issues"
Repository = "https://github.com/ZaowenChen/mjlab-peg-hole-search.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjlab_contact_prep = ["_vendor/*.json", "_vendor/LICENSE", "_vendor/README.md"]
