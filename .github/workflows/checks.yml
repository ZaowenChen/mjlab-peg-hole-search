name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Portable configuration, frozen source and layout tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_configuration.py' -v
          python -m unittest discover -s tests -p 'test_frozen_source.py' -v
          python -m unittest discover -s tests -p 'test_repository_layout.py' -v
      - name: Validate committed JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
                  print(path)
          PY
